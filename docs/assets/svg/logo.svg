<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00d4ff" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#glow)" stroke-width="2.5" opacity="0.6"/>
  <!-- Orbit path -->
  <ellipse cx="100" cy="100" rx="65" ry="30" fill="none" stroke="#00d4ff" stroke-width="1.2" opacity="0.3" transform="rotate(-25 100 100)"/>
  <ellipse cx="100" cy="100" rx="65" ry="30" fill="none" stroke="#8b5cf6" stroke-width="1.2" opacity="0.3" transform="rotate(25 100 100)"/>
  <!-- Central body -->
  <circle cx="100" cy="100" r="28" fill="#0a0e27" stroke="url(#glow)" stroke-width="2" filter="url(#shadow)"/>
  <!-- Z letter -->
  <text x="100" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="32" fill="url(#glow)">Z</text>
  <!-- Satellite dots -->
  <circle cx="155" cy="75" r="5" fill="#00d4ff" opacity="0.9">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="130" r="4" fill="#8b5cf6" opacity="0.8">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="145" r="3" fill="#00e676" opacity="0.7">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- Stars -->
  <circle cx="30" cy="40" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="170" cy="35" r="1" fill="white" opacity="0.4"/>
  <circle cx="25" cy="160" r="1.2" fill="white" opacity="0.3"/>
  <circle cx="175" cy="170" r="1" fill="white" opacity="0.5"/>
  <circle cx="100" cy="20" r="1.5" fill="white" opacity="0.4"/>
</svg>
