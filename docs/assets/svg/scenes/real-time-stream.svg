<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060a1a"/>
      <stop offset="100%" style="stop-color:#0f1538"/>
    </linearGradient>
    <filter id="glow3"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="800" height="350" fill="url(#bg3)"/>
  <!-- Stars -->
  <circle cx="80" cy="50" r="1" fill="white" opacity="0.5"/>
  <circle cx="250" cy="30" r="0.8" fill="white" opacity="0.4"/>
  <circle cx="500" cy="45" r="1.1" fill="white" opacity="0.5"/>
  <circle cx="700" cy="25" r="0.7" fill="white" opacity="0.3"/>
  
  <!-- Data stream tubes -->
  <!-- Tube 1 -->
  <path d="M50 175 Q200 100 400 175 Q600 250 750 175" fill="none" stroke="#00d4ff" stroke-width="30" opacity="0.05"/>
  <path d="M50 175 Q200 100 400 175 Q600 250 750 175" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.3"/>
  <!-- Tube 2 -->
  <path d="M50 175 Q200 250 400 175 Q600 100 750 175" fill="none" stroke="#8b5cf6" stroke-width="25" opacity="0.04"/>
  <path d="M50 175 Q200 250 400 175 Q600 100 750 175" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.25"/>
  
  <!-- Data particles flowing -->
  <circle r="3" fill="#00d4ff" opacity="0.8">
    <animateMotion dur="3s" repeatCount="indefinite" path="M50 175 Q200 100 400 175 Q600 250 750 175"/>
  </circle>
  <circle r="2.5" fill="#00d4ff" opacity="0.6">
    <animateMotion dur="3s" repeatCount="indefinite" begin="0.5s" path="M50 175 Q200 100 400 175 Q600 250 750 175"/>
  </circle>
  <circle r="2" fill="#00d4ff" opacity="0.4">
    <animateMotion dur="3s" repeatCount="indefinite" begin="1s" path="M50 175 Q200 100 400 175 Q600 250 750 175"/>
  </circle>
  <circle r="3" fill="#8b5cf6" opacity="0.7">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M50 175 Q200 250 400 175 Q600 100 750 175"/>
  </circle>
  <circle r="2" fill="#8b5cf6" opacity="0.5">
    <animateMotion dur="3.5s" repeatCount="indefinite" begin="0.8s" path="M50 175 Q200 250 400 175 Q600 100 750 175"/>
  </circle>
  
  <!-- Monitor panels along the sides -->
  <rect x="30" y="80" width="60" height="40" rx="3" fill="none" stroke="#00d4ff" stroke-width="0.8" opacity="0.3"/>
  <line x1="38" y1="95" x2="82" y2="95" stroke="#00e676" stroke-width="1" opacity="0.3"/>
  <line x1="38" y1="105" x2="72" y2="105" stroke="#ffb300" stroke-width="1" opacity="0.2"/>
  
  <rect x="30" y="230" width="60" height="40" rx="3" fill="none" stroke="#8b5cf6" stroke-width="0.8" opacity="0.3"/>
  <line x1="38" y1="245" x2="82" y2="245" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
  <line x1="38" y1="255" x2="68" y2="255" stroke="#ff5252" stroke-width="1" opacity="0.2"/>
  
  <rect x="710" y="80" width="60" height="40" rx="3" fill="none" stroke="#00d4ff" stroke-width="0.8" opacity="0.3"/>
  <rect x="718" y="90" width="8" height="22" fill="#00d4ff" opacity="0.2"/>
  <rect x="730" y="96" width="8" height="16" fill="#00e676" opacity="0.2"/>
  <rect x="742" y="88" width="8" height="24" fill="#8b5cf6" opacity="0.2"/>
  <rect x="754" y="92" width="8" height="20" fill="#ffb300" opacity="0.2"/>
  
  <rect x="710" y="230" width="60" height="40" rx="3" fill="none" stroke="#00e676" stroke-width="0.8" opacity="0.3"/>
  <!-- Alert icon -->
  <circle cx="740" cy="250" r="8" fill="none" stroke="#ffb300" stroke-width="1" opacity="0.4"/>
  <text x="740" y="254" text-anchor="middle" font-family="Arial" font-size="12" fill="#ffb300" opacity="0.5">!</text>
  
  <!-- Center hub -->
  <circle cx="400" cy="175" r="35" fill="#0a0e27" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
  <circle cx="400" cy="175" r="25" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.3"/>
  <text x="400" y="172" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#00d4ff" opacity="0.8">REAL</text>
  <text x="400" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#00d4ff" opacity="0.8">TIME</text>
  
  <!-- Speed indicators -->
  <text x="400" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#00d4ff" opacity="0.4">Eventhouse · Eventstream · KQL · Activator</text>
</svg>
