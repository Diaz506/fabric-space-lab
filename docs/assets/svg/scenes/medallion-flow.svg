<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060a1a"/>
      <stop offset="100%" style="stop-color:#1a1a4e"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#cd7f32"/>
      <stop offset="100%" style="stop-color:#8b4513"/>
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c0c0c0"/>
      <stop offset="100%" style="stop-color:#808080"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#daa520"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="800" height="350" fill="url(#bg)"/>
  <!-- Stars -->
  <circle cx="40" cy="30" r="1" fill="white" opacity="0.5"/>
  <circle cx="150" cy="60" r="0.8" fill="white" opacity="0.4"/>
  <circle cx="680" cy="40" r="1" fill="white" opacity="0.5"/>
  <circle cx="750" cy="100" r="0.7" fill="white" opacity="0.3"/>
  <circle cx="100" cy="310" r="0.8" fill="white" opacity="0.4"/>
  <circle cx="400" cy="20" r="1.2" fill="white" opacity="0.5"/>
  
  <!-- BRONZE crystal -->
  <polygon points="160,120 210,80 260,120 260,220 210,260 160,220" fill="none" stroke="url(#bronze)" stroke-width="2" opacity="0.8"/>
  <polygon points="160,120 210,80 260,120 260,220 210,260 160,220" fill="#cd7f32" opacity="0.1"/>
  <text x="210" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#cd7f32" opacity="0.8">BRONZE</text>
  <!-- Raw data particles -->
  <circle cx="170" cy="150" r="2" fill="#cd7f32" opacity="0.5"/>
  <circle cx="240" cy="140" r="1.5" fill="#cd7f32" opacity="0.4"/>
  <circle cx="190" cy="200" r="2.5" fill="#cd7f32" opacity="0.3"/>
  <circle cx="230" cy="190" r="1.8" fill="#cd7f32" opacity="0.5"/>
  
  <!-- Arrow Bronze → Silver -->
  <line x1="270" y1="170" x2="330" y2="170" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
  <polygon points="330,165 345,170 330,175" fill="#00d4ff" opacity="0.5"/>
  <!-- Data stream particles -->
  <circle cx="290" cy="168" r="2" fill="#00d4ff" opacity="0.4">
    <animate attributeName="cx" values="270;340" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- SILVER crystal -->
  <polygon points="360,120 410,80 460,120 460,220 410,260 360,220" fill="none" stroke="url(#silver)" stroke-width="2" opacity="0.8"/>
  <polygon points="360,120 410,80 460,120 460,220 410,260 360,220" fill="#c0c0c0" opacity="0.08"/>
  <text x="410" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#c0c0c0" opacity="0.8">SILVER</text>
  <!-- Organized data lines -->
  <line x1="375" y1="145" x2="445" y2="145" stroke="#c0c0c0" stroke-width="0.8" opacity="0.3"/>
  <line x1="375" y1="160" x2="445" y2="160" stroke="#c0c0c0" stroke-width="0.8" opacity="0.3"/>
  <line x1="375" y1="195" x2="445" y2="195" stroke="#c0c0c0" stroke-width="0.8" opacity="0.3"/>
  <line x1="375" y1="210" x2="445" y2="210" stroke="#c0c0c0" stroke-width="0.8" opacity="0.3"/>
  
  <!-- Arrow Silver → Gold -->
  <line x1="470" y1="170" x2="530" y2="170" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
  <polygon points="530,165 545,170 530,175" fill="#00d4ff" opacity="0.5"/>
  <circle cx="490" cy="168" r="2" fill="#ffd700" opacity="0.4">
    <animate attributeName="cx" values="470;540" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- GOLD crystal -->
  <polygon points="560,120 610,80 660,120 660,220 610,260 560,220" fill="none" stroke="url(#gold)" stroke-width="2.5" opacity="0.9"/>
  <polygon points="560,120 610,80 660,120 660,220 610,260 560,220" fill="#ffd700" opacity="0.08"/>
  <text x="610" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#ffd700" opacity="0.9">GOLD</text>
  <!-- Star/sparkle -->
  <path d="M610 145 L613 155 L623 155 L615 161 L618 171 L610 165 L602 171 L605 161 L597 155 L607 155Z" fill="#ffd700" opacity="0.4"/>
  
  <!-- Labels -->
  <text x="210" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#cd7f32" opacity="0.6">Raw Landing</text>
  <text x="410" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#c0c0c0" opacity="0.6">Cleaned &amp; Typed</text>
  <text x="610" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#ffd700" opacity="0.6">Business-Ready</text>
</svg>
